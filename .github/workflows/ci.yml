name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      BASE: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:approved
      - run: npm run build
      - name: Verificar comportamento no navegador
        shell: pwsh
        run: |
          $previewProcess = Start-Process node -ArgumentList 'scripts/preview.mjs' -WindowStyle Hidden -PassThru -RedirectStandardOutput preview.log -RedirectStandardError preview-error.log
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-WebRequest "$env:BASE/pt" -UseBasicParsing | Out-Null
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            npm run check:behavior -- --quick
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $previewProcess.Id -ErrorAction SilentlyContinue
          }
      - run: npm audit --omit=dev --audit-level high
      - run: npm run audit:dev
