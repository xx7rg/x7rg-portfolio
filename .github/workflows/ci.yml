name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      BASE: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:approved
      - run: npm run build
      - name: Verificar comportamento no navegador
        shell: bash
        run: |
          node scripts/preview.mjs > preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$BASE/pt" > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run check:behavior -- --quick
      - run: npm audit --omit=dev --audit-level high
      - run: npm run audit:dev
